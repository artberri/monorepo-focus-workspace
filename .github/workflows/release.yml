# Publishes a GitHub release to the VS Code Marketplace and Open VSX.
#
# 1. build:   runs QA, packages the .vsix once, attests its provenance and
#             attaches it to the GitHub release.
# 2. publish: one job per registry, both gated by the `release` environment
#             (add yourself as a required reviewer), so nothing reaches a
#             registry until the built and attested .vsix is approved.
#
# Both registries use OIDC trusted publishing: no tokens are stored. Their
# trusted-publisher policies must name this workflow (release.yml) and the
# `release` environment.
name: release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  VSIX: monorepo-focus-workspace.vsix

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .vsix to the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi
      - name: Run QA
        run: npm run qa
      - name: Package
        run: npm run package
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.VSIX }}
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$VSIX" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ${{ env.VSIX }}
          if-no-files-found: error
          retention-days: 30 # match GitHub's re-run window, so a failed publish can be retried

  publish-marketplace:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://marketplace.visualstudio.com/items?itemName=alberto-varela.monorepo-focus-workspace
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish to the VS Code Marketplace
        env:
          PRE_RELEASE: ${{ github.event.release.prerelease }}
        run: |
          args=(--oidc --packagePath "$VSIX" --skip-duplicate)
          if [ "$PRE_RELEASE" = "true" ]; then args+=(--pre-release); fi
          npx --no-install vsce publish "${args[@]}"

  publish-open-vsx:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://open-vsx.org/extension/alberto-varela/monorepo-focus-workspace
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
      - name: Publish to Open VSX
        env:
          PRE_RELEASE: ${{ github.event.release.prerelease }}
        run: |
          args=(--trusted-publishing --packagePath "$VSIX" --skip-duplicate)
          if [ "$PRE_RELEASE" = "true" ]; then args+=(--pre-release); fi
          npx --no-install ovsx publish "${args[@]}"
